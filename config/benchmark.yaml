dataset:
  id: OR4D-NCM811-CleanPeak-acom-v3
  description: Stratified Clean-Peak benchmark with legacy smoke controls, a Sobol-SO(3) headline core, and ACOM grid probes.
  structure_id: NCM811_113035
  cif_path: data/structure/NCM811_113035.cif
  orientation_convention: sample_to_crystal
  beam_axis_sample: [0.0, 0.0, 1.0]
  headline_sample_role: headline_core
  expected_sample_counts:
    legacy_smoke: 17
    headline_core: 1024
    acom_grid_probe: 40
  expected_num_orientations: 1081

# Hand-designed anchor orientations. ori_005--ori_008 use non-zero
# in-plane angles deliberately placed between the 4-degree ACOM plan bins.
orientations:
  - orientation_id: ori_000
    sampling_type: low_index_anchor
    zone_axis_uvw: [0, 0, 1]
    x_reference_uvw: [1, 0, 0]
    in_plane_rotation_deg: 0.0
  - orientation_id: ori_001
    sampling_type: low_index_anchor
    zone_axis_uvw: [1, 0, 0]
    x_reference_uvw: [0, 0, 1]
    in_plane_rotation_deg: 0.0
  - orientation_id: ori_002
    sampling_type: low_index_anchor
    zone_axis_uvw: [1, 1, 0]
    x_reference_uvw: [0, 0, 1]
    in_plane_rotation_deg: 0.0
  - orientation_id: ori_003
    sampling_type: low_index_anchor
    zone_axis_uvw: [1, 0, 1]
    x_reference_uvw: [0, 1, 0]
    in_plane_rotation_deg: 0.0
  - orientation_id: ori_004
    sampling_type: low_index_anchor
    zone_axis_uvw: [1, 0, 2]
    x_reference_uvw: [0, 1, 0]
    in_plane_rotation_deg: 0.0
  - orientation_id: ori_005
    sampling_type: nonzero_in_plane
    zone_axis_uvw: [0, 0, 1]
    x_reference_uvw: [1, 0, 0]
    in_plane_rotation_deg: 6.1
  - orientation_id: ori_006
    sampling_type: nonzero_in_plane
    zone_axis_uvw: [1, 0, 0]
    x_reference_uvw: [0, 0, 1]
    in_plane_rotation_deg: 14.2
  - orientation_id: ori_007
    sampling_type: nonzero_in_plane
    zone_axis_uvw: [1, 1, 0]
    x_reference_uvw: [0, 0, 1]
    in_plane_rotation_deg: 22.3
  - orientation_id: ori_008
    sampling_type: nonzero_in_plane
    zone_axis_uvw: [1, 0, 1]
    x_reference_uvw: [0, 1, 0]
    in_plane_rotation_deg: 30.4

# Preserve the eight v1 SO(3) smoke samples exactly. Candidate 7 was rejected by
# the v1 spacing filter, so the retained candidate indices are explicit.
legacy_so3_sampling:
  enabled: true
  orientation_id_start: 9
  candidate_indices: [0, 1, 2, 3, 4, 5, 6, 8]
  method: shoemake_low_discrepancy
  sequence_offset: 0.3819660112501051

clean_sampling:
  # The headline cohort is ACOM-independent. A scrambled Sobol sequence is
  # mapped to uniform SO(3) rotations with the Shoemake transform.
  headline_core:
    enabled: true
    count: 1024
    orientation_id_prefix: core_
    method: sobol_shoemake
    scramble: true
    seed: 20260728
    duplicate_tolerance_deg: 0.000001

  # Diagnostic-only probes for the canonical 2-degree in-plane ACOM grid. These
  # cover one grid cell from a small sub-grid offset to the half-step boundary.
  # never enter the headline metric.
  acom_grid_probes:
    enabled: true
    orientation_id_prefix: probe_
    in_plane_offsets_deg: [0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875, 1.0]
    bases:
      - probe_axis_id: za_001
        zone_axis_uvw: [0, 0, 1]
        x_reference_uvw: [1, 0, 0]
      - probe_axis_id: za_100
        zone_axis_uvw: [1, 0, 0]
        x_reference_uvw: [0, 0, 1]
      - probe_axis_id: za_110
        zone_axis_uvw: [1, 1, 0]
        x_reference_uvw: [0, 0, 1]
      - probe_axis_id: za_101
        zone_axis_uvw: [1, 0, 1]
        x_reference_uvw: [0, 1, 0]
      - probe_axis_id: za_102
        zone_axis_uvw: [1, 0, 2]
        x_reference_uvw: [0, 1, 0]

common:
  accelerating_voltage_V: 300000.0
  k_max_Ainv: 1.5
  central_beam_exclusion_Ainv: 0.03
  normalize_peak_intensity: max

clean:
  sigma_excitation_error_Ainv: 0.02
  tol_excitation_error_mult: 3.0
  tol_structure_factor: 0.0001
  tol_intensity: 0.0001

# py4DSTEM ACOM baseline. The test orientations are generated independently
# from this orientation plan. The canonical report uses 2 degrees; the sweep
# keeps 4 degrees for backward comparison and adds an intermediate 3 degrees.
acom:
  zone_axis_range: auto
  angle_step_zone_axis_deg: 2.0
  angle_step_in_plane_deg: 2.0
  sweep_angle_steps_deg: [4.0, 3.0, 2.0]
  corr_kernel_size_Ainv: 0.08
  sigma_excitation_error_Ainv: 0.02
  power_radial: 1.0
  power_intensity_simulated: 0.25
  power_intensity_experiment: 0.25
  tol_distance_Ainv: 0.01
  min_number_peaks: 3
  inversion_symmetry: true
  num_matches_return: 1
  cuda: false
  progress_bar: true
  min_probe_discrete_seed_misorientation_deg: 0.1

evaluation:
  headline_sample_role: headline_core
  plan_distance_bin_edges_deg: [0.0, 0.5, 1.0, 2.0]
  strict_friedel_disagreement_tolerance_deg: 0.001
  coordinate_match_tolerance_Ainv: 0.08
  max_peak_overlay_samples: 12

# These values remain available for the later Dynamical track.
dynamical:
  thickness_nm: 5.0
  disorder_supercell: [2, 5, 1]
  disorder_seed_base: 4200
  orthogonalize_max_repetitions: 8
  xy_repeat: [2, 2]
  real_space_sampling_A: 0.12
  slice_thickness_A: 1.0
  semiangle_cutoff_mrad: 0.5
  defocus_A: 0.0
  scan_gpts: [2, 2]
  frozen_phonon_configs: 2
  frozen_phonon_sigma_A: 0.08
  frozen_phonon_seed_base: 8200
  max_angle_mrad: 40.0
  peak_extraction:
    gaussian_sigma_px: 1.0
    threshold_rel: 0.005
    min_distance_px: 3
    integration_radius_px: 2
    max_num_peaks: 256

extends: benchmark_v5.yaml

dataset:
  id: OR4D-NCM811-CleanImage-v6
  description: 16384 independent symmetry/Friedel-canonical Clean orientations.
  headline_sample_role: headline_core
  expected_sample_counts:
    headline_core: 16384
  expected_num_orientations: 16384

legacy_manual:
  enabled: false

legacy_so3_sampling:
  enabled: false

clean_sampling:
  headline_core:
    enabled: true
    count: 16384
    orientation_id_prefix: v6_core_
    method: haar_uniform_so3
    seed: 26080501
    canonicalize_crystal_symmetry: true
    canonicalize_friedel: true
    canonical_quaternion_decimals: 12
    duplicate_tolerance_deg: 0.000001
    dedup_query_initial_neighbors: 8
    distribution_euler_sequence: ZYZ
  acom_grid_probes:
    enabled: false

common:
  accelerating_voltage_V: 300000.0
  k_max_Ainv: 1.5
  central_beam_exclusion_Ainv: 0.03

clean_image:
  forward_model: coherent_first_born
  gpts: [512, 512]
  q_max_Ainv: 1.6
  convergence_semiangle_mrad: 1.2
  thickness_nm: 5.0
  cuda_first_born:
    batch_size: 32
  counting:
    model: poisson_expected_total_from_areal_dose
    doses_e_per_A2: [0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0, 300.0, 1000.0]
    stochastic_repeats: 3
    seed_base: 26080502
    rng_algorithm: PCG64
    cuda_rng_algorithm: cupy.RandomState.CURAND_RNG_PSEUDO_DEFAULT
    cuda_seed_modulus: 4294967296
  instrument_noise:
    model: empad_g2_gaussian_read_noise_after_frame_sum
    reference_detector: EMPAD-G2
    reference_beam_energy_keV: 300.0
    reference_read_noise_keV_rms_per_pixel: 2.6
    reference_read_noise_primary_e_rms_per_pixel: 0.008666666666666666
    source_doi: 10.1017/S1431927621013701
    seed_base: 26080503
    levels:
      - id: deterministic_count
        poisson_shot_noise: false
        summed_frame_count: 0
        stochastic_repeats: 1
      - id: poisson_shot
        poisson_shot_noise: true
        summed_frame_count: 0
        stochastic_repeats: 3
      - id: empad_g2_1frame
        poisson_shot_noise: true
        summed_frame_count: 1
        stochastic_repeats: 3
      - id: empad_g2_16frame_fixed_total_dose
        poisson_shot_noise: true
        summed_frame_count: 16
        stochastic_repeats: 3

v6:
  schema_version: clean-v6.0
  config_name: benchmark_v6
  headline_orientation_count: 16384
  trace_intermediates: true
  large_artifacts_server_only: true
  paths:
    server_code_root: /home/xietianhong/OR4D-NCM811-smoke-v0
    server_root: /mnt/data/xietianhong/or4d-clean-v6
    orientations: /mnt/data/xietianhong/or4d-clean-v6/manifests/orientations.jsonl
    orientation_summary: /mnt/data/xietianhong/or4d-clean-v6/manifests/orientation_summary.json
    expectation: /mnt/data/xietianhong/or4d-clean-v6/datasets/clean_expectation.h5
    physical_oracle_peaks: /mnt/data/xietianhong/or4d-clean-v6/oracle/physical_oracle_peaks.h5
    physical_oracle_reflections: /mnt/data/xietianhong/or4d-clean-v6/oracle/physical_oracle_reflections.h5
    observation_manifest: /mnt/data/xietianhong/or4d-clean-v6/manifests/observations.json
    expectation_shards: /mnt/data/xietianhong/or4d-clean-v6/datasets/expectation_shards
    expectation_merge_manifest: /mnt/data/xietianhong/or4d-clean-v6/manifests/expectation_merge.json
    observation_shards: /mnt/data/xietianhong/or4d-clean-v6/observations/poisson
    peak_root: /mnt/data/xietianhong/or4d-clean-v6/peaks
    acom_root: /mnt/data/xietianhong/or4d-clean-v6/acom
    diagnostics_root: /mnt/data/xietianhong/or4d-clean-v6/diagnostics
    run_record_root: /mnt/data/xietianhong/or4d-clean-v6/run_records
  study_001:
    enabled: true
    included_in_headline_count: false
  effective_probe_area:
    definition: intensity_participation_ratio
    real_space_oversampling: 4
    normalization_tolerance: 1.0e-7
    q_axis_uniformity_relative_tolerance: 5.0e-5
  observation_store:
    root: /mnt/data/xietianhong/or4d-clean-v6
    soft_quota_GB: 450.0
    physical_sample_shard_size: 128
    dense_codec: zstd
    dense_codec_level: 5
    shuffle: bitshuffle
    sparse_codec: zstd
    sparse_codec_level: 5
    sparse_switch_fraction: 0.35
    dense_chunk_patterns: 1
    sample_block_size: 8
    sparse_value_chunk_length: 32768
    minimum_free_GiB: 5.0
    sha256_read_block_MiB: 8
    persist_expectation: true
    persist_poisson_realizations: true
    factorize_deterministic_counts: true
    factorize_read_noise: true
    reconstruction_audit_samples_per_shard: 2
    formal_poisson_compute_backend: cuda
  expectation_generation:
    orientation_shard_size: 4096
    expected_shard_count: 4
    merge_chunk_patterns: 8
    smoke_orientation_count: 17
  ubragg_x:
    repository_path: /home/xietianhong/UBragg
    repository_commit: 3d9ea143e1d09907a5fa27dff7e4e230e9f88931
    checkpoint_path: /mnt/data/xietianhong/UBragg/runs/ubragg-x-noise-v2-ddp/best.pt
    checkpoint_size_bytes: 12421769
    checkpoint_sha256: e327c466cb2e483aa3c0bf1767692e4827b212c3c21aeb6835b74d17018efb27
    score_threshold: 0.5
    clean_e_inference_reference_total_electrons: 1000000.0
    batch_size_candidates: [1, 2, 4]
    output_covariance: true
    use_covariance_in_acom: false
  gpu_backends:
    first_born: cupy
    poisson: cupy
    find_bragg_disks: py4dstem_cuda_batched
    ubragg_x: pytorch_cuda
    autodisk: cupy_equivalent_or_cpu
    dog_rgm: cupy_equivalent_or_cpu
    equivalence_position_tolerance_px: 0.001
    equivalence_intensity_rtol: 0.0001
  detection:
    detectors: [autodisk, dog_rgm, py4dstem, ubragg_x]
    output_compression: zstd
    output_compression_level: 5
    output_shuffle: bitshuffle
    py4dstem_batch_size: 8
    cpu_sample_workers: 8
    failure_message_max_characters: 2000
    progress_every_observations: 256
  runtime:
    server_id: SL3053
    enforce_write_scope_for_users: [xietianhong]
    allowed_write_roots:
      - /home/xietianhong
      - /mnt/data/xietianhong
    conda_executable: /home/xietianhong/miniconda3/bin/conda
    conda_environment: or4d-clean
    max_gpus: 4
    require_empty_gpu: true
    empty_gpu_max_memory_MiB: 100
    empty_gpu_max_utilization_percent: 5
    max_cpu_threads_total: 32
    max_cpu_threads_per_gpu_at_four_gpus: 8
    dataloader_workers_total: 16
    prefetch_factor: 2
    progress_every_patterns: 256
    resume: true
  acom:
    cuda: true
    angle_step_zone_axis_deg: 2.0
    angle_step_in_plane_deg: 2.0
    num_matches_return: 5
    insufficient_peaks_policy: skip
    shard_condition_balancing: true
  evaluation:
    peak_match_tolerance_px: 2.0
    high_angle_radius_fraction: 0.75
    orientation_accuracy_thresholds_deg: [1.0, 2.0, 5.0]
    catastrophic_error_threshold_deg: 5.0
    polar_metrics:
      enabled: true
      beam_axis_sample: [0.0, 0.0, 1.0]
      polar_reference_crystal_axis: [0.0, 0.0, 1.0]
      azimuth_reference_crystal_axis: [1.0, 0.0, 0.0]
      azimuth_valid_min_tilt_deg: 1.0
      beam_accuracy_thresholds_deg: [1.0, 2.0, 5.0]
      azimuth_accuracy_thresholds_deg: [2.0, 5.0, 10.0]
